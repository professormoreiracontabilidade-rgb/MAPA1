<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff3ff">
  <title>Imagem | Professor Moreira</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #dff3ff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
    }

    .pagina {
      width: 100%;
      height: calc(100vh - 16px);
      height: calc(100dvh - 16px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
      background: white;
    }
  </style>
</head>

<body>
  <main class="pagina">
    <!--
      IMPORTANTE:
      Coloque este index.html e a imagem na MESMA pasta do GitHub.
      Renomeie sua imagem para: imagem.webp

      Estrutura:
      /
      ├── index.html
      └── imagem.webp
    -->
    <img src="imagem.webp" alt="Material de estudo — Professor Moreira">
  </main>
</body>
</html>
